<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Escapa del Sótano: TP final de IA para NPC (PIAPC, UNRaf)"
    />
    <title>Escapa del Sótano | PIAPC</title>
  </head>
  <body>
    <main class="laboratory">
      <header class="laboratory__header">
        <div>
          <p class="eyebrow">PIAPC 2026 / TP final: IA para NPC</p>
          <h1>Escapa del Sótano</h1>
        </div>
        <p class="status"><span></span> Prototipo jugable</p>
      </header>

      <section class="game-shell" aria-label="Escenario del laboratorio">
        <div id="game"></div>
        <aside class="controls">
          <p><strong>Movimiento</strong> WASD o flechas</p>
          <p><strong>Sigilo</strong> Shift</p>
          <p><strong>Derribar</strong> E</p>
          <p><strong>Distraer</strong> clic</p>
          <p><strong>Otro sótano</strong> G</p>
          <p><strong>Búsqueda</strong> Espacio</p>
          <p><strong>Navegación</strong> C</p>
          <p><strong>Demostración</strong> V</p>
          <p><strong>Pausa / paso</strong> P / N</p>
          <p><strong>Reiniciar</strong> R</p>
        </aside>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
